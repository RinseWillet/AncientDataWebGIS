# Local-dev profile: run against the throwaway PostGIS container started via
# docker-compose.local-dev.yml instead of the real NAS-hosted database.
# Activate with: ./gradlew bootRun --args='--spring.profiles.active=local-dev'
#
# Make sure .env's DB_URL/DB_USER/DB_PASSWORD point at the local-dev container:
#   DB_URL=jdbc:postgresql://localhost:5433/webGIS_DB_dev
#   DB_USER=webgis_client
#   DB_PASSWORD=local_dev_only
# (must match docker-compose.local-dev.yml's POSTGRES_* values)

management.endpoints.web.exposure.include=env, info, health

# Safety check only — this schema is a local mirror seeded by
# docs/architecture/sql/local-dev-seed.sql, never altered by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
server.port=8080

# increase upload and download size files to 50 mb
spring.servlet.multipart.max-file-size = 50MB
spring.servlet.multipart.max-request-size = 50MB

# logging file configuration
logging.file.name=logs/ancientdata.log

# NAS/DB backup features are irrelevant to a throwaway local container —
# force them off regardless of what's set in .env.
backup.nas.enabled=false
backup.db.enabled=false

# Local media storage (separate from the real ./media dev folder, so seeded
# uploads never mix with real downloaded media)
media.storage-path=./media-local-dev
media.base-url=http://localhost:8080/api/media/files


management.endpoints.web.exposure.include=env, info, health

# Load local .env when present (works in IDE/CLI without extra plugins)
spring.config.import=optional:file:.env[.properties]

# database configuration
spring.application.name=ancientdata

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Set a few MB above MediaService.HARD_REJECT_CEILING (50MB) so a file right at
# that ceiling can actually reach MediaService's own check and get its friendly
# MEDIA_FILE_TOO_LARGE message, instead of always being cut off here first by
# Spring's multipart resolver (GlobalExceptionHandler still catches anything
# that does exceed this as a defensive backstop).
spring.servlet.multipart.max-file-size = 55MB
spring.servlet.multipart.max-request-size = 55MB

# Tomcat's default max-swallow-size (2MB) is how much of an oversized request body
# it will keep reading-and-discarding after rejecting it, before giving up and
# closing the connection outright. A multi-MB upload blows past that in an instant,
# so the connection gets reset mid-upload rather than left open long enough for the
# client to read the 413 response — curl tolerates this (via `Expect: 100-continue`),
# but a browser fetch()/XHR upload (which doesn't negotiate 100-continue) sees a raw
# connection error instead of the response body, surfacing as a generic "Upload
# failed" with none of GlobalExceptionHandler's actual error detail. Set comfortably
# above the multipart ceiling above so the server always finishes reading the
# request and the client always gets a real HTTP response.
server.tomcat.max-swallow-size = 100MB

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# logging file configuration
logging.file.name=logs/ancientdata.log

logging.level.org.flywaydb=DEBUG

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:0}

# CORS configuration (comma-separated for multiple origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Media storage
media.storage-path=${MEDIA_STORAGE_PATH:./media}
media.base-url=${MEDIA_BASE_URL:http://localhost:8080/api/media/files}

# NAS backup (mounted filesystem — see backup script docs)
# Set BACKUP_NAS_ENABLED=true in .env to activate
backup.nas.enabled=${BACKUP_NAS_ENABLED:false}
backup.nas.mount-path=${BACKUP_NAS_MOUNT_PATH:/backup/media}
backup.nas.sync-cron=${BACKUP_NAS_SYNC_CRON:0 0 3 * * SUN}

# Database backup (pg_dump) — set BACKUP_DB_ENABLED=true in .env to activate
backup.db.enabled=${BACKUP_DB_ENABLED:false}
backup.db.host=${DATABASE_HOST:}
backup.db.port=${DATABASE_PORT:5432}
backup.db.name=${DATABASE_NAME:}
backup.db.user=${DATABASE_USER:}
backup.db.password=${DATABASE_PASSWORD:}
backup.db.output-path=${BACKUP_DB_OUTPUT_PATH:/backup/db}

# How old (in hours) a backup's timestamp must be before it is flagged as stale
backup.staleness-threshold-hours=${BACKUP_STALENESS_THRESHOLD_HOURS:192}

# GeoServer raster proxy (ADR-012) — internal Docker network address, not the
# LAN-published admin port (2675). Default matches docker-compose.yml's
# `geoserver` service/network as-is; only override for non-compose setups.
geoserver.internal-url=${GEOSERVER_INTERNAL_URL:http://geoserver:8080/geoserver}


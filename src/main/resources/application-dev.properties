management.endpoints.web.exposure.include=env, info, health

# database configuration
#noinspection SpringBootApplicationProperties
spring.jpa.hibernate.ddl-auto=validate
server.port=8080

# Set a few MB above MediaService.HARD_REJECT_CEILING (50MB) — see application.properties
spring.servlet.multipart.max-file-size = 55MB
spring.servlet.multipart.max-request-size = 55MB
# Prevents a connection reset on oversized uploads before the client can read the
# 413 response — see application.properties
server.tomcat.max-swallow-size = 100MB

# logging file configuration
logging.file.name=logs/ancientdata.log

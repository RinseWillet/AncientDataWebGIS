# Application stack — connects to the shared PostGIS infrastructure stack
# running separately on the NAS (see docs/architecture/docker-infra-compose.yml).
#
# Required .env vars:
#   DATABASE_HOST, DATABASE_PORT, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   GEOSERVER_ADMIN_PASSWORD, MEDIA_BASE_URL
#
# Port exposure policy (see ancientdataworkspace/deploy/README.md "Database &
# GeoServer access (QGIS)" section for full rationale):
#   - `ancientdata`: NEVER publishes a host port. It's only reached via the
#     shared `webgis-edge` network by the reverse-proxy stack in
#     `ancientdataworkspace/deploy/docker-compose.yml` — public exposure only
#     happens through the reverse proxy / Cloudflare Tunnel.
#   - `geoserver`: publishes a host port (LAN-reachable) for direct QGIS/admin
#     access. This is NOT the same as internet exposure — do NOT forward this
#     port on the router. Reach it either directly on the home LAN, or
#     remotely via Cloudflare Zero Trust WARP Private Network routing (same
#     free Tunnel already set up for the website).
version: '3.9'
services:
  ancientdata:
    image: rinsedev/ancientdata
    restart: on-failure
    expose:
      - "8080"
    networks:
      - webgis-edge
    volumes:
      - /volume1/docker/ancientdata/media:/app/media:rw
      - /volume1/docker/ancientdata/backup:/backup:rw
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_PORT=${DATABASE_PORT:-2665}
      - MEDIA_STORAGE_PATH=/app/media
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://localhost:8080/api/media/files}
      - BACKUP_NAS_ENABLED=${BACKUP_NAS_ENABLED:-false}
      - BACKUP_NAS_MOUNT_PATH=${BACKUP_NAS_MOUNT_PATH:-/backup/media}
      - BACKUP_NAS_SYNC_CRON=${BACKUP_NAS_SYNC_CRON:-0 0 3 * * SUN}
      - BACKUP_DB_ENABLED=${BACKUP_DB_ENABLED:-false}
      - BACKUP_DB_OUTPUT_PATH=${BACKUP_DB_OUTPUT_PATH:-/backup/db}
      - BACKUP_STALENESS_THRESHOLD_HOURS=${BACKUP_STALENESS_THRESHOLD_HOURS:-192}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

  geoserver:
    container_name: GeoServer
    image: kartoza/geoserver:2.24.1
    environment:
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
    volumes:
      - /volume1/docker/ancientdata/geoserver:/opt/geoserver/data_dir:rw
      # Raw source rasters (GeoTIFFs), kept in their own top-level NAS
      # directory — separate from GeoServer's own operational data_dir
      # (security config, workspace/store config, GWC tile cache) so it can
      # be backed up on its own, without also capturing GeoServer's
      # regenerable cache. Mounted *inside* data_dir in the container so
      # GeoServer's store-creation file browser can reach it; the host-side
      # path stays independent for backup purposes. See ADR-012.
      - /volume1/docker/ancientdata/rastermaps:/opt/geoserver/data_dir/rastermaps:ro
    ports:
      - "2675:8080"
    networks:
      - webgis-edge
    restart: on-failure

networks:
  webgis-edge:
    external: true





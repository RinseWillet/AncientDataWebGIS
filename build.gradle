// spring-boot-buildpack-platform (bootBuildImage tooling) pulls httpclient5:5.6.1 -> httpcore5:5.4,
// which is vulnerable to GHSA-hf6x-8p5f-cgmf (memory-exhaustion DoS). spring-boot-gradle-plugin 4.1.0
// is still the latest plugin release and hasn't bumped it, so force the patched version on the plugin classpath.
buildscript {
    configurations.classpath {
        resolutionStrategy {
            force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
            force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        }
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.webgis'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM // Eclipse Temurin, matches Dockerfile base image
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = "https://repo1.maven.org/maven2/" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT Authentication Dependencies (Fixed)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Security Crypto for password hashing
    implementation 'org.springframework.security:spring-security-crypto'

    // Security-critical dependencies (Dependabot CVE fixes)
    implementation 'org.apache.commons:commons-lang3:3.20.0' // CVE-2025-48924 - already latest
    implementation 'org.json:json:20251224' // CVE-2023-5072 - already latest
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1' // GHSA-72hv-8253-57qq incomplete fix, needs >=2.21.4
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1' // keep in sync with jackson-core above
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22' // databind 2.22.x needs jackson-annotations 2.22 (JsonApplyView), BOM only manages 2.21
    // Jackson 3.x line pulled in transitively via flyway-database-postgresql -> jackson-bom 3.1.4;
    // Spring Boot 4.1.0's BOM caps it there, so pin directly to get the @JsonView fix (needs >=3.1.5)
    implementation 'tools.jackson.core:jackson-core:3.2.1'
    implementation 'tools.jackson.core:jackson-databind:3.2.1'


    // ...existing code...
    implementation 'com.drewnoakes:metadata-extractor:2.19.0' // EXIF GPS extraction for media geotagging
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    implementation 'org.n52.jackson:jackson-datatype-jts:2.0.0'
    implementation 'org.hibernate.orm:hibernate-spatial' // keep BOM-managed to align with Hibernate core from Spring Boot
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.3.Final'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql:42.7.13' // channel-binding downgrade fix, needs >=42.7.12
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 split MockMvc test autoconfig into spring-boot-webmvc-test, and the
    // Spring-Security-aware MockMvc auto-wiring (SecurityMockMvcAutoConfiguration)
    // into spring-boot-starter-security-test. See docs/architecture/adr/ADR-009.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'com.h2database:h2:2.2.224'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileTestJava') {
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('test') {
    useJUnitPlatform()
}
